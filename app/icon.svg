<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C4D" />
      <stop offset="50%" stop-color="#F04438" />
      <stop offset="100%" stop-color="#C92519" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF5F5" />
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#6B0C06" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Squircle with subtle depth -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- First Aid Medical Cross -->
  <g filter="url(#shadow)">
    <!-- Vertical bar -->
    <rect x="24" y="14" width="16" height="36" rx="5" fill="url(#crossGrad)" />
    <!-- Horizontal bar -->
    <rect x="14" y="24" width="36" height="16" rx="5" fill="url(#crossGrad)" />
  </g>

  <!-- Center Golden Pulse Core (Symbolizing Life & Care) -->
  <circle cx="32" cy="32" r="5" fill="#FFD166" />
  <circle cx="32" cy="32" r="2.5" fill="#FFFFFF" />

  <!-- Emergency Beacon in Top-Right Corner -->
  <circle cx="49" cy="15" r="4.5" fill="#FFD166" stroke="#A71D14" stroke-width="1.5" />
</svg>
